const $ = id => document.getElementById(id);
const ctx = $('view').getContext('2d'), W=960,H=480;
let selection='bara_freeze', started=performance.now();
const imageCache = new Map();
function imageFor(id) {
 if (!imageCache.has(id)) {
  const img=new Image(); img.src="assets/antics_vol2/"+data.animations[id].png;
  img.onerror=()=>{$('description').textContent='Extract the full ZIP and keep preview.html next to the sprites folder.'};
  imageCache.set(id,img);
 }
 return imageCache.get(id);
}
function paintSprite(id, elapsed, x, y, scale) {
 const a=data.animations[id], img=imageFor(id);
 if (!img.complete||!img.naturalWidth) return;
 let offset=elapsed%a.durationMs;
 let frame=0;
 while (frame<a.frameMs.length-1&&offset>=a.frameMs[frame]) offset-=a.frameMs[frame++];
 const [sx,sy,w,h]=a.frames[frame];
 ctx.drawImage(img,sx,sy,w,h,x-w*scale/2,y-h*scale/2,w*scale,h*scale);
}
function show(time) {
 const elapsed=Math.max(0,time-started);
 const gradient=ctx.createRadialGradient(480,240,60,480,240,520);
 gradient.addColorStop(0,'#222e49');gradient.addColorStop(1,'#0b111d');
 ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
 const a=data.animations[selection], [, ,w,h]=a.frames[0];
 const scale=Math.min(2.4,350/h,650/w);
 paintSprite(selection,elapsed,480,240,scale,true);
 requestAnimationFrame(show);
}
function select(id) {
 selection=id;started=performance.now();
 const a=data.animations[id];
 $('title').textContent=a.title;
 $('description').textContent=a.visual+'.  ·  '+data.categories[a.category]+'  ·  '+a.event.replaceAll('_',' ');
 document.querySelectorAll('[data-asset]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.asset===id));
}
function refresh() {
 const category=$('category').value,q=$('query').value.toLowerCase().trim();
 $('assets').replaceChildren();
 let count=0;
 for (const [id,a] of Object.entries(data.animations)) {
  if(category && category!==a.category)continue;
  if(q && ![id,a.title,a.visual].join(' ').toLowerCase().includes(q))continue;
  const b=document.createElement('button');b.className='clip';b.dataset.asset=id;b.textContent=a.title;
  const small=document.createElement('small');small.textContent=data.categories[a.category];b.append(small);
  b.setAttribute('aria-pressed',selection===id);b.onclick=()=>select(id);
  $('assets').append(b);count++;
 }
 $('count').textContent=count+' of 18 animations';
}
for (const [id,label] of Object.entries(data.categories)) {
 const opt=document.createElement('option');opt.value=id;opt.textContent=label;$('category').append(opt);
}
$('category').onchange=refresh;$('query').oninput=refresh;
$('replay').onclick=()=>{started=performance.now();};
select(selection);refresh();requestAnimationFrame(show);
